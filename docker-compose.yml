services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillswap-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www:z
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - skillswap

  nginx:
    image: nginx:alpine
    container_name: skillswap-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - app
    networks:
      - skillswap

  pgsql:
    image: postgres:17-alpine
    container_name: skillswap-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillswap
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap
    ports:
      - "5432:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skillswap

  redis:
    image: redis:7-alpine
    container_name: skillswap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - skillswap

  mailpit:
    image: axllent/mailpit:latest
    container_name: skillswap-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - skillswap

volumes:
  pgsql-data:
  redis-data:

networks:
  skillswap:
    driver: bridge